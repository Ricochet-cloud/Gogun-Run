<svg xmlns="http://www.w3.org/2000/svg" width="64" height="70" viewBox="0 0 64 70" shape-rendering="crispEdges">
  <!-- Seamless Horizontally Tileable Ground Texture (64x70) -->
  <!-- Base Ground Fill -->
  <rect x="0" y="0" width="64" height="70" fill="#181a24"/>

  <!-- Top Moss & Pathway Surface Border (y: 0..4) -->
  <rect x="0" y="0" width="64" height="1" fill="#6b779a"/>
  <rect x="0" y="1" width="64" height="2" fill="#464d67"/>
  <rect x="0" y="3" width="64" height="2" fill="#2d3347"/>

  <!-- Cobblestone & Packed Earth Texture Layer 1 (y: 6..18) -->
  <!-- Stone 1 -->
  <rect x="2" y="6" width="14" height="5" fill="#262a3b"/>
  <rect x="3" y="6" width="12" height="1" fill="#353b52"/>
  <!-- Stone 2 -->
  <rect x="20" y="7" width="18" height="5" fill="#222535"/>
  <rect x="21" y="7" width="16" height="1" fill="#2f344a"/>
  <!-- Stone 3 -->
  <rect x="42" y="6" width="20" height="6" fill="#262a3b"/>
  <rect x="43" y="6" width="18" height="1" fill="#353b52"/>

  <!-- Cobblestone Layer 2 (y: 15..28) -->
  <rect x="10" y="14" width="22" height="6" fill="#202332"/>
  <rect x="11" y="14" width="20" height="1" fill="#2b3044"/>
  <rect x="36" y="15" width="24" height="6" fill="#242838"/>
  <rect x="37" y="15" width="22" height="1" fill="#31364c"/>

  <!-- Bedrock & Deep Soil Texture (y: 28..70) -->
  <rect x="0" y="28" width="64" height="1" fill="#13151e"/>
  <!-- Bedrock strata -->
  <rect x="4" y="34" width="24" height="4" fill="#14161f"/>
  <rect x="36" y="38" width="20" height="4" fill="#14161f"/>
  <rect x="14" y="48" width="36" height="5" fill="#12131b"/>
  <rect x="2" y="58" width="28" height="4" fill="#101117"/>
  <rect x="38" y="60" width="22" height="4" fill="#101117"/>
</svg>
