  <!-- Thorn 2 -->
  <polygon points="19,5 14,28 24,28" fill="#590d22"/>
  <rect x="18" y="6" width="2" height="3" fill="#ff758f"/>

  <!-- Thorn 3 -->
  <polygon points="30,0 25,28 35,28" fill="#780000"/>
  <rect x="29" y="1" width="2" height="3" fill="#ff4d6d"/>

  <!-- Thorn 4 -->
  <polygon points="41,4 36,28 46,28" fill="#590d22"/>
  <rect x="40" y="5" width="2" height="3" fill="#ff758f"/>

  <!-- Sinister Ground Tendrils -->
