<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" shape-rendering="crispEdges">
  <defs>
    <linearGradient id="nightSky" x1="0" y1="0" x2="0" y2="290" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#070913"/>
      <stop offset="60%" stop-color="#121829"/>
      <stop offset="100%" stop-color="#1d243a"/>
    </linearGradient>
  </defs>

  <!-- Sky Gradient -->
  <rect x="0" y="0" width="640" height="290" fill="url(#nightSky)"/>

  <!-- Twinkling Pixel Stars (Seamlessly positioned) -->
  <rect x="35" y="24" width="2" height="2" fill="#ffffff" opacity="0.8"/>
  <rect x="85" y="55" width="1" height="1" fill="#ffffff" opacity="0.6"/>
  <rect x="140" y="32" width="2" height="2" fill="#cde4ff" opacity="0.7"/>
  <rect x="195" y="70" width="1" height="1" fill="#ffffff" opacity="0.5"/>
  <rect x="230" y="18" width="2" height="2" fill="#ffffff" opacity="0.9"/>
  <rect x="280" y="48" width="1" height="1" fill="#cde4ff" opacity="0.6"/>
  <rect x="340" y="28" width="2" height="2" fill="#ffffff" opacity="0.7"/>
  <rect x="410" y="62" width="1" height="1" fill="#ffffff" opacity="0.5"/>
  <rect x="475" y="20" width="2" height="2" fill="#cde4ff" opacity="0.8"/>
  <rect x="520" y="85" width="1" height="1" fill="#ffffff" opacity="0.6"/>
  <rect x="610" y="35" width="2" height="2" fill="#ffffff" opacity="0.7"/>

  <!-- Luminous Full Moon -->
  <circle cx="560" cy="48" r="24" fill="rgba(255, 243, 205, 0.12)"/>
  <circle cx="560" cy="48" r="18" fill="rgba(255, 243, 205, 0.25)"/>
  <circle cx="560" cy="48" r="15" fill="#fefae0"/>
  <!-- Subtle Moon Crater Details -->
  <rect x="554" y="44" width="3" height="3" fill="#e9edc9" opacity="0.7"/>
  <rect x="562" y="50" width="4" height="2" fill="#e9edc9" opacity="0.7"/>

  <!-- Distant Sacred Mountain Silhouette (Mt. Sagiri - Seamless at x=0 and x=640) -->
  <!-- Left start y=230, right end y=230 -->
  <polygon points="0,290 0,230 60,205 120,225 190,185 270,240 360,195 440,235 520,180 590,220 640,230 640,290" fill="#101322"/>
  <polygon points="60,205 70,212 120,225 190,185 200,195 360,195 380,205 520,180 540,195 640,230 640,290 0,290 0,230" fill="#161b2e" opacity="0.6"/>
</svg>
